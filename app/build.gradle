plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pixelwallet'
    compileSdk 34

    defaultConfig {
        applicationId 'com.pixelwallet'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    testOptions {
        unitTests {
            // Robolectric precisa dos layouts, cores e fonte para abrir as telas nos testes
            includeAndroidResources = true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Alinha as versões do kotlin-stdlib que vêm junto com o AndroidX (evita classes duplicadas)
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.13'
}
